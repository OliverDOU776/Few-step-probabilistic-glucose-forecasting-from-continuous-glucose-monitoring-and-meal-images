name: Validate cleanup branch

on:
  push:
    paths:
      - .github/workflows/validate-cleanup-branch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/reusable-release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          python -m pip install \
            'matplotlib>=3.8,<4' 'numpy>=1.26,<2' 'pandas>=2.2,<3' \
            'PyYAML>=6,<7' 'scikit-learn>=1.4,<2' 'scipy>=1.13,<2' \
            'pytest>=8,<9'
          python -m pip install -e . --no-deps

      - name: Validate release tree
        run: python scripts/validate_release.py

      - name: Run tests
        run: pytest -q

      - name: Run checkpoint smoke test
        run: python scripts/smoke_test.py

      - name: Run custom-adapter example
        run: |
          mkdir -p /tmp/glucoflow-example
          cat > /tmp/glucoflow-example/cgm.csv <<'CSV'
          subject_id,timestamp,glucose_mgdl
          A,2026-01-01 00:00:00,100
          A,2026-01-01 00:05:00,104
          A,2026-01-01 00:10:00,108
          B,2026-01-01 00:00:00,95
          B,2026-01-01 00:05:00,97
          CSV
          python examples/custom_adapter.py /tmp/glucoflow-example
